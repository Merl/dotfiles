# ~/.tmux.conf - tmux 3.5 (Debian 13)

# screen like prefix: C-a (C-a a sends a literal C-a)
set -g prefix C-a
unbind C-b
bind a send-prefix

# reload this file
unbind r
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# C-a C-a: cycle through the panes of the current window
unbind C-a
bind C-a select-pane -t :.+

# terminal: tmux-256color inside, true colour for xterm-like outer terminals
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -g xterm-keys on
# short escape delay for vim mode switches, but long enough that replies
# from the outer terminal (e.g. OSC 11 colour queries) arrive in one piece
# over ssh; at 10 ms they leaked into the shell as "11;rgb:..."
set -s escape-time 50
# focus events for vim autoread
set -g focus-events on

# next window instead of next layout
unbind Space
bind Space next-window

# kill session, don't ask
unbind k
bind k confirm-before -p "kill-session #S? (y/n)" kill-session

set -g set-clipboard on
set -g history-limit 50000
set -g status-interval 1
setw -g monitor-activity on
set -g visual-activity on

# window split
unbind %
unbind '"'
bind | split-window -h
bind - split-window -v

# window titles in the outer terminal
set -g set-titles on

# vi style editing
setw -g mode-keys vi
set -g status-keys vi

# copy and paste
bind Escape copy-mode
bind p paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# status line, generated by tmuxline.vim (see ~/.vimrc)
source-file -q ~/.tmuxline.conf

# host-specific additions
source-file -q ~/.overwrites/tmux.conf
